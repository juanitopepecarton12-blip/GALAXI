<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Galaxia Interactiva 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Georgia', serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #input-video {
      display: none;
    }
    #instrucciones {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 220, 240, 0.9);
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    #btn-camara {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      padding: 12px 20px;
      background: #e91e63;
      border: none;
      color: #fff;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(233, 30, 99, 0.6);
      transition: all 0.3s ease;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <video id="input-video" playsinline></video>
  <button id="btn-camara">Activar Cámara</button>
  
  <div id="instrucciones">
    Abre la mano para expandir | Cierra la mano para contraer | Toca la pantalla para probar
  </div>

  <script>
    // 1. CONFIGURACIÓN THREE.JS
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 22);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // TEXTURA DE ESFERA GORDITA Y LUMINOSA PARA PARTÍCULAS 3D
    function createSphereTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.35, 'rgba(255, 255, 255, 0.9)');
      gradient.addColorStop(0.65, 'rgba(255, 255, 255, 0.35)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }
    const sphereTexture = createSphereTexture();

    // 2. NÚCLEO (AGUJERO NEGRO Y ANILLO)
    const centroGroup = new THREE.Group();
    scene.add(centroGroup);

    const sphereGeo = new THREE.SphereGeometry(0.65, 32, 32);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x010102 });
    const agujeroNegro = new THREE.Mesh(sphereGeo, sphereMat);
    centroGroup.add(agujeroNegro);

    const numDisco = 3500;
    const discoGeo = new THREE.BufferGeometry();
    const discoPos = new Float32Array(numDisco * 3);
    const discoColors = new Float32Array(numDisco * 3);

    for (let i = 0; i < numDisco; i++) {
      const r = 0.7 + Math.random() * 0.9;
      const ang = Math.random() * Math.PI * 2;
      
      discoPos[i * 3] = Math.cos(ang) * r;
      discoPos[i * 3 + 1] = (Math.random() - 0.5) * 0.05; // Volumen vertical en disco
      discoPos[i * 3 + 2] = Math.sin(ang) * r;

      discoColors[i * 3] = 1.0;
      discoColors[i * 3 + 1] = 0.85 + Math.random() * 0.15;
      discoColors[i * 3 + 2] = 0.1 + Math.random() * 0.3;
    }

    discoGeo.setAttribute('position', new THREE.BufferAttribute(discoPos, 3));
    discoGeo.setAttribute('color', new THREE.BufferAttribute(discoColors, 3));

    const discoMat = new THREE.PointsMaterial({
      size: 0.11, // Partículas más gorditas
      vertexColors: true,
      map: sphereTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const discoPoints = new THREE.Points(discoGeo, discoMat);
    centroGroup.add(discoPoints);

    // 3. GALAXIA DE PARTÍCULAS GORDITAS EN 3D (ANCHO, LARGO Y ALTO)
    const galaxiaGroup = new THREE.Group();
    scene.add(galaxiaGroup);

    const numEstrellas = 16000;
    const galaxiaGeo = new THREE.BufferGeometry();
    const galaxiaPos = new Float32Array(numEstrellas * 3);
    const galaxiaColors = new Float32Array(numEstrellas * 3);
    const galaxiaData = [];

    const paleta = [
      [1.0, 0.1, 0.25],
      [1.0, 0.2, 0.4],
      [1.0, 0.4, 0.6],
      [1.0, 0.85, 0.2],
      [1.0, 0.95, 0.5],
      [1.0, 0.6, 0.2]
    ];

    for (let i = 0; i < numEstrellas; i++) {
      const r = 1.6 + Math.pow(Math.random(), 0.65) * 11.5;
      const brazo = Math.floor(Math.random() * 4);
      let ang = brazo * (Math.PI / 2) + r * 0.52 + (Math.random() - 0.5) * 0.3;
      
      // Dispersión tridimensional amplia (Alto, Largo y Ancho)
      const x = Math.cos(ang) * r + (Math.random() - 0.5) * 0.25;
      const y = (Math.random() - 0.5) * 0.35 * (1 + r * 0.12); // Mayor altura
      const z = Math.sin(ang) * r + (Math.random() - 0.5) * 0.25;

      galaxiaPos[i * 3] = x;
      galaxiaPos[i * 3 + 1] = y;
      galaxiaPos[i * 3 + 2] = z;

      const col = paleta[Math.floor(Math.random() * paleta.length)];
      galaxiaColors[i * 3] = col[0];
      galaxiaColors[i * 3 + 1] = col[1];
      galaxiaColors[i * 3 + 2] = col[2];

      galaxiaData.push({ r, ang });
    }

    galaxiaGeo.setAttribute('position', new THREE.BufferAttribute(galaxiaPos, 3));
    galaxiaGeo.setAttribute('color', new THREE.BufferAttribute(galaxiaColors, 3));

    const galaxiaMat = new THREE.PointsMaterial({
      size: 0.11, // Tamaño aumentado para verse gorditas y definidas
      vertexColors: true,
      map: sphereTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const galaxiaMesh = new THREE.Points(galaxiaGeo, galaxiaMat);
    galaxiaGroup.add(galaxiaMesh);

    // 4. CORAZÓN CÓSMICO CON ESFERAS GORDITAS 3D
    const corazonGroup = new THREE.Group();
    scene.add(corazonGroup);

    const numCorazon = 5500;
    const corazonGeo = new THREE.BufferGeometry();
    const corazonPos = new Float32Array(numCorazon * 3);
    const corazonColors = new Float32Array(numCorazon * 3);
    const corazonData = [];

    for (let i = 0; i < numCorazon; i++) {
      const t = Math.random() * Math.PI * 2;
      let hx = 16 * Math.pow(Math.sin(t), 3);
      let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let hz = (Math.random() - 0.5) * 1.2; // Mayor grosor en Z para el corazón

      const escala = 0.18; 
      const factorInt = Math.random();
      hx *= escala * factorInt;
      hy *= escala * factorInt;
      hz *= escala;

      corazonPos[i * 3] = hx;
      corazonPos[i * 3 + 1] = hy;
      corazonPos[i * 3 + 2] = hz;

      const cr = 0.9 + Math.random() * 0.1;
      const cg = Math.random() * 0.15;
      const cb = 0.7 + Math.random() * 0.3;

      corazonColors[i * 3] = cr;
      corazonColors[i * 3 + 1] = cg;
      corazonColors[i * 3 + 2] = cb;

      corazonData.push({
        baseR: cr, baseG: cg, baseB: cb,
        fase: Math.random() * Math.PI * 2,
        vel: 3.0 + Math.random() * 5.0
      });
    }

    corazonGeo.setAttribute('position', new THREE.BufferAttribute(corazonPos, 3));
    corazonGeo.setAttribute('color', new THREE.BufferAttribute(corazonColors, 3));

    const corazonMat = new THREE.PointsMaterial({
      size: 0.10, // Partículas del corazón bien tupidas y gorditas
      vertexColors: true,
      map: sphereTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const corazonMesh = new THREE.Points(corazonGeo, corazonMat);
    corazonGroup.add(corazonMesh);

    // 5. FRASES EN ÓRBITA GRANDES Y LEGIBLES
    const frases = [
      "LA QUIERO BEBÉ PRINCESA",
      "HERMOSA",
      "CAUTIVADORA",
      "INTELIGENTE",
      "BRILLANTE",
      "MI LINDA SEÑORITA",
      "VALIENTE Y DULCE",
      "MI CHURITOS PRECIOSA",
      "NUNCA SE RINDA",
      "USTED PUEDE CUA CUA",
      "ÚNICA Y MARAVILLOSA",
      "MI NIÑA ENOJONA"
    ];

    function crearSpriteTexto(texto) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;

      ctx.font = 'Bold 68px Georgia';
      ctx.fillStyle = '#ffea9f'; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.shadowColor = 'rgba(255, 20, 147, 0.9)';
      ctx.shadowBlur = 22;
      ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(material);
      
      sprite.scale.set(8.5, 2.125, 1); 
      return sprite;
    }

    const frasesGroup = new THREE.Group();
    scene.add(frasesGroup);
    const spritesFrases = frases.map((f) => {
      const s = crearSpriteTexto(f);
      frasesGroup.add(s);
      return s;
    });

    // 6. ANIMACIÓN
    let expansionFactor = 0.4;
    let factorObjetivo = 0.4;
    let anguloInclinacion = 25.0;

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const tiempo = clock.getElapsedTime();

      expansionFactor += (factorObjetivo - expansionFactor) * 0.1;

      const incObj = expansionFactor > 1.1 ? 0.0 : 25.0;
      anguloInclinacion += (incObj - anguloInclinacion) * 0.1;

      scene.rotation.x = THREE.MathUtils.degToRad(anguloInclinacion);

      centroGroup.rotation.y = tiempo * 0.3;
      galaxiaGroup.rotation.y = tiempo * 0.15;

      const positions = galaxiaGeo.attributes.position.array;
      for (let i = 0; i < numEstrellas; i++) {
        const d = galaxiaData[i];
        const currR = d.r * expansionFactor;
        const currAng = d.ang + tiempo * (0.08 / (d.r + 0.1));

        positions[i * 3] = Math.cos(currAng) * currR;
        positions[i * 3 + 2] = Math.sin(currAng) * currR;
      }
      galaxiaGeo.attributes.position.needsUpdate = true;

      if (expansionFactor > 0.5) {
        corazonGroup.visible = true;
        const altCor = 2.8 + (expansionFactor - 0.5) * 1.6;
        corazonGroup.position.set(0, altCor, 0);

        const latido = 1.0 + 0.05 * Math.sin(tiempo * 6.0);
        corazonGroup.scale.set(latido, latido, latido);

        const colors = corazonGeo.attributes.color.array;
        for (let i = 0; i < numCorazon; i++) {
          const cd = corazonData[i];
          const fBrillo = 0.5 + 0.5 * Math.sin(tiempo * cd.vel + cd.fase);
          colors[i * 3] = cd.baseR * fBrillo;
          colors[i * 3 + 1] = cd.baseG * fBrillo;
          colors[i * 3 + 2] = cd.baseB * fBrillo;
        }
        corazonGeo.attributes.color.needsUpdate = true;
      } else {
        corazonGroup.visible = false;
      }

      if (expansionFactor > 0.7) {
        frasesGroup.visible = true;
        spritesFrases.forEach((s, i) => {
          const ang = tiempo * 0.15 + (i * (Math.PI * 2 / spritesFrases.length));
          const dist = 9.2 * expansionFactor;
          s.position.set(Math.cos(ang) * dist, 1.8, Math.sin(ang) * dist);
          s.material.opacity = Math.min(1.0, (expansionFactor - 0.6) * 2.0);
        });
      } else {
        frasesGroup.visible = false;
      }

      renderer.render(scene, camera);
    }

    animate();

    // 7. CÁMARA Y MEDIAPIPE
    const videoElement = document.getElementById('input-video');
    const btnCamara = document.getElementById('btn-camara');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const muneca = landmarks[0];
        const medio = landmarks[12];

        const dist = Math.hypot(medio.x - muneca.x, medio.y - muneca.y);
        factorObjetivo = THREE.MathUtils.lerp(0.35, 1.85, (dist - 0.18) / 0.22);
        factorObjetivo = THREE.MathUtils.clamp(factorObjetivo, 0.35, 1.85);
      }
    });

    btnCamara.addEventListener('click', async () => {
      try {
        const cameraUtils = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        await cameraUtils.start();
        btnCamara.innerText = "Cámara Activa ✓";
        btnCamara.style.background = "#4caf50";
      } catch (err) {
        alert("Asegúrate de permitir el acceso a la cámara en las opciones del navegador.");
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.id !== 'btn-camara') {
        factorObjetivo = factorObjetivo < 1.0 ? 1.85 : 0.35;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
